<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage kiểu Bonjourr</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=System+UI:wght@100;200;300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative; /* Để định vị credit */
        }

        body {
            background: url('https://raw.githubusercontent.com/khathiatz/khathiatz.github.io/master/assets/background.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Overlay tối nhẹ */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        .clocks {
            position: relative;
            z-index: 1;
            margin-bottom: 60px;
        }

        .clock {
            font-size: 7rem;
            font-weight: 100;
            letter-spacing: -0.05em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .clock-label {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.9;
            margin-top: -10px;
            margin-bottom: 30px;
        }

        .secondary-clocks {
            display: flex;
            gap: 100px;
            margin-top: 20px;
        }

        .secondary-clock {
            font-size: 2.5rem;
            font-weight: 200;
        }

        .secondary-label {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .bookmarks {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            max-width: 900px;
            width: 90%;
            margin-top: 40px;
        }

        .bookmark {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.2s;
        }

        .bookmark:hover {
            opacity: 1;
            transform: translateY(-5px);
        }

        .icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .icon img {
            width: 48px;
            height: 48px;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Phần credit ở góc trái dưới */
        .credit {
            position: absolute;
            bottom: 20px;
            left: 30px;
            z-index: 1;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .credit:hover {
            opacity: 1;
        }

        .credit a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .credit a:hover {
            border-bottom-color: white;
        }

        @media (max-width: 768px) {
            .clock { font-size: 5rem; }
            .secondary-clocks { flex-direction: column; gap: 30px; }
            .bookmarks { grid-template-columns: repeat(3, 1fr); }
            .credit { left: 20px; bottom: 15px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="clocks">
        <div class="clock" id="local-time">00:00</div>
        <div class="clock-label">Giờ địa phương</div>

        <div class="secondary-clocks">
            <div>
                <div class="secondary-clock" id="utc0-time">00:00</div>
                <div class="secondary-label">UTC+0</div>
            </div>
            <div>
                <div class="secondary-clock" id="utc-8-time">00:00</div>
                <div class="secondary-label">UTC-8</div>
            </div>
        </div>
    </div>

    <div class="bookmarks">
        <a href="https://google.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=google.com" alt="Google"></div>
            <span class="title">Google</span>
        </a>
        <a href="https://youtube.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=youtube.com" alt="YouTube"></div>
            <span class="title">YouTube</span>
        </a>
        <a href="https://gmail.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=gmail.com" alt="Gmail"></div>
            <span class="title">Gmail</span>
        </a>
        <a href="https://github.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=github.com" alt="GitHub"></div>
            <span class="title">GitHub</span>
        </a>
        <a href="https://x.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=x.com" alt="X"></div>
            <span class="title">X</span>
        </a>

        <a href="https://reddit.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=reddit.com" alt="Reddit"></div>
            <span class="title">Reddit</span>
        </a>
        <a href="https://chat.openai.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=chat.openai.com" alt="ChatGPT"></div>
            <span class="title">ChatGPT</span>
        </a>
        <a href="https://drive.google.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=drive.google.com" alt="Drive"></div>
            <span class="title">Drive</span>
        </a>
        <a href="https://maps.google.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=maps.google.com" alt="Maps"></div>
            <span class="title">Maps</span>
        </a>
        <a href="https://news.google.com" class="bookmark">
            <div class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=news.google.com" alt="News"></div>
            <span class="title">News</span>
        </a>
    </div>

    <!-- Credit ở góc trái dưới -->
    <div class="credit">
        made by <a href="https://www.google.com" target="_blank">me</a>
    </div>

    <script>
        function updateLocalClock() {
            const element = document.getElementById('local-time');
            setInterval(() => {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                element.textContent = `${hours}:${minutes}`;
            }, 1000);
        }

        function updateUtcClock(id, offsetHours) {
            const element = document.getElementById(id);
            setInterval(() => {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const time = new Date(utc + (3600000 * offsetHours));
                const hours = time.getHours().toString().padStart(2, '0');
                const minutes = time.getMinutes().toString().padStart(2, '0');
                element.textContent = `${hours}:${minutes}`;
            }, 1000);
        }

        updateLocalClock();
        updateUtcClock('utc0-time', 0);
        updateUtcClock('utc-8-time', -8);
    </script>
</body>
</html>
